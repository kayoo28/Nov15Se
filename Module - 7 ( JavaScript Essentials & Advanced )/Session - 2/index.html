<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session 2 - Variables & Data Types</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
    }

    .profile {
      margin-top: 25px;
      padding: 20px;
      background: #eee;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Session 2: Variables & Data Types</h1>

    <div class="profile">
      <h2>Instagram Profile</h2>
      <p><strong>Name:</strong> Mohit</p>
      <p><strong>Followers:</strong> 1500</p>
      <p><strong>Verified:</strong> Yes</p>
    </div>
  </div>

  <script>

    let userName = "Mohit";
    let followers = 1500;
    let isVerified = true;


    console.log("User Name:", userName);
    console.log("Followers:", followers);
    console.log("Verified:", isVerified);



    var favoriteFoodApp = "Zomato";

    console.log("Original app:", favoriteFoodApp);

    favoriteFoodApp = "Swiggy";
    console.log("After reassignment:", favoriteFoodApp);

    var favoriteFoodApp = "Uber Eats";
    console.log("After redeclaration:", favoriteFoodApp);


    const MAX_POSTS = 100;

    console.log("MAX_POSTS:", MAX_POSTS);
    const favoriteSongs = ["Song A", "Song B", "Song C"];

    favoriteSongs.push("Song D");
    console.log("Favorite Songs:", favoriteSongs);

    const spotifyProfile = {
      userName: "Mohit",
      playlists: ["Workout", "Chill", "Travel"],
      isPremium: true
    };
    console.log("Spotify Profile:", spotifyProfile);
    console.log("Playlists:", spotifyProfile.playlists);


    let user1 = "Priya";
    let user2 = user1;

    user1 = "Riya";
    console.log("user1:", user1);
    console.log("user2:", user2);


    let favApps1 = ["Instagram", "Spotify"];
    let favApps2 = favApps1;

    favApps1.push("Zomato");
    console.log("favApps1:", favApps1);
    console.log("favApps2:", favApps2);

    let favFood = "pizza";
    let favFoodCopy = favFood;

    favFood = "burger";
    console.log("favFood:", favFood);
    console.log("favFoodCopy:", favFoodCopy);


    const zomatoUser = {
      city: "Surat"
    };

    const zomatoUserCopy = zomatoUser;

    zomatoUser.city = "Mumbai";

    console.log("zomatoUser:", zomatoUser);
    console.log("zomatoUserCopy:", zomatoUserCopy);


    function showProfile(name, followers, isPremium) {

      console.log("Name:", name);
      console.log("Followers:", followers);
      console.log("Type of followers:", typeof followers);

      followers = "1500";

      console.log("Followers after changing to string:", followers);
      console.log("Type:", typeof followers);

      followers = 1500;

      console.log("Followers after changing back to number:", followers);
      console.log("Type:", typeof followers);

      console.log("Premium:", isPremium);
      console.log("Type of premium:", typeof isPremium);
    }

    showProfile("Mohit", 1500, true);

    function displayProfile(userName, followers) {
      console.log(`I am ${userName} and I have ${followers} followers`);
    }

    displayProfile("Mohit", 1500);

  </script>

</body>
</html>
