<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 6 - Box Model & Positioning</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">


        <div class="task-wrapper visible-border card-padding card-spacing">
            <h3 class="task-title">Task 1: Zomato-style Restaurant Card (Box Model)</h3>

            <div class="zomato-card visible-border card-padding">
                <div class="zomato-section">
                    <h2 class="restaurant-name">Punjab Grill</h2>
                </div>
                <div class="zomato-section">
                    <p class="cuisine-type">North Indian • Mughlai • Biryani</p>
                </div>
                <div class="zomato-section">
                    <span class="rating-badge">⭐ 4.6</span>
                </div>
            </div>
        </div>


        <div class="task-wrapper visible-border card-padding card-spacing">
            <h3 class="task-title">Task 2: Flipkart Product Tile (Display Properties)</h3>

            <div class="flipkart-tile visible-border card-padding">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" alt="Headphones"
                    class="product-image">
                <span class="product-title">Sony WH-1000XM5</span>


                <span class="product-price">₹26,990</span>
            </div>
        </div>


        <div class="task-wrapper visible-border card-padding card-spacing">
            <h3 class="task-title">Task 4: BookMyShow Movie Poster Grid (Relative & Absolute Position)</h3>

            <div class="movie-grid">

                <div class="movie-card visible-border">
                    <span class="badge-new">NEW</span>
                    <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300" alt="Movie 1">
                    <h4>Interstellar</h4>
                </div>


                <div class="movie-card visible-border">
                    <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300" alt="Movie 2">
                    <h4>Inception</h4>
                </div>
            </div>
        </div>

    </div>


    <div class="whatsapp-badge">
        <span>💬 WhatsApp</span>
        <span class="notification-count">3</span>
    </div>

</body>

</html>
