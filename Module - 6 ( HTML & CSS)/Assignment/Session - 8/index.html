<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session 8 - Responsive Design Tasks</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div class="flipkart-card">
    

    <div class="product-image-container">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Sony Headphones">
    </div>


    <div class="product-details">
      <h2 class="product-title">Sony WH-1000XM5 Wireless Headphones</h2>
      <span class="rating-badge">⭐ 4.6 (2,450 Reviews)</span>
      
      <div class="price-container">
        <span class="current-price">₹26,990</span>
        <span class="original-price">₹34,990</span>
        <span class="discount">22% OFF</span>
      </div>

      <p class="product-desc">
        Industry-leading noise cancellation with two processors and 8 microphones. Ultra-comfortable lightweight design with soft fit leather.
      </p>

      <button class="btn-buy">Buy Now</button>
    </div>

  </div>

</body>
</html>
